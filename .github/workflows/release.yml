name: Release

# Pushing a version tag (v1.2.3, or v1.2.3-beta.1 for a pre-release) runs the full CI gate, builds
# the signed release APK and publishes it, with checksums and a build-provenance attestation, as
# a GitHub release.
#
# One-time setup, repository Settings > Secrets and variables > Actions:
#   KEYSTORE_BASE64    base64 -i my-release-key.jks | pbcopy
#   KEYSTORE_PASSWORD  store password
#   KEY_ALIAS          key alias (my-key-alias)
#   KEY_PASSWORD       key password
# Optional repository variable RELEASE_CERT_SHA256: pins the expected signing certificate so a
# wrong keystore can never produce a release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
      - "v[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: read

jobs:
  verify:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
      security-events: write
      actions: read

  release:
    name: Build, sign and publish
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    permissions:
      contents: write # create the release and upload assets
      id-token: write # build provenance attestation
      attestations: write
    env:
      TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Tag must point at a commit on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$TAG is not reachable from main. Releases are only cut from main."
            exit 1
          fi

      - name: Derive version from the tag
        id: version
        run: |
          version="${TAG#v}"
          if ! [[ "$version" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::tag '$TAG' is not a semantic version"
            exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          if [ "$minor" -gt 99 ] || [ "$patch" -gt 99 ] || [ "$major" -gt 200 ]; then
            echo "::error::minor and patch must be <= 99 to fit the versionCode scheme"
            exit 1
          fi
          code=$((major * 10000 + minor * 100 + patch))
          prerelease=false
          if [ -n "${BASH_REMATCH[4]}" ]; then prerelease=true; fi
          {
            echo "name=$version"
            echo "code=$code"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "versionName=$version versionCode=$code prerelease=$prerelease"

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
        with:
          cache-read-only: true

      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::secret $name is not set (see the header of release.yml)"
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$keystore"
          chmod 600 "$keystore"
          {
            echo "storeFile=$keystore"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 keystore.properties

      - name: Build signed release APK
        run: >
          ./gradlew assembleRelease --console=plain
          -PappVersionName="${{ steps.version.outputs.name }}"
          -PappVersionCode="${{ steps.version.outputs.code }}"

      - name: Verify signature and version
        env:
          EXPECTED_CERT_SHA256: ${{ vars.RELEASE_CERT_SHA256 }}
        run: |
          apk="$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)"
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs "$apk" | tee verify.txt
          grep -q "Verified using v2 scheme (APK Signature Scheme v2): true" verify.txt \
            || grep -q "Verified using v3 scheme" verify.txt \
            || { echo "::error::APK is not signed with a v2/v3 scheme"; exit 1; }
          cert="$(grep -m1 "certificate SHA-256 digest" verify.txt | awk '{print $NF}')"
          echo "signing certificate SHA-256: $cert"
          if [ -n "$EXPECTED_CERT_SHA256" ]; then
            expected="$(echo "$EXPECTED_CERT_SHA256" | tr -d ':' | tr 'A-F' 'a-f')"
            if [ "$cert" != "$expected" ]; then
              echo "::error::signing certificate $cert does not match RELEASE_CERT_SHA256"
              exit 1
            fi
          fi
          badging="$("$tools/aapt2" dump badging "$apk")"
          echo "$badging" | grep -q "versionName='${{ steps.version.outputs.name }}'" \
            || { echo "::error::versionName in the APK does not match the tag"; exit 1; }
          echo "$badging" | grep -q "versionCode='${{ steps.version.outputs.code }}'" \
            || { echo "::error::versionCode in the APK does not match the tag"; exit 1; }
          mkdir -p dist
          cp "$apk" "dist/CountMe-${TAG}.apk"
          (cd dist && sha256sum "CountMe-${TAG}.apk" > "CountMe-${TAG}.apk.sha256")
          echo "$cert" > dist/signing-certificate.sha256

      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/CountMe-${{ github.ref_name }}.apk

      - name: Keep the R8 mapping for de-obfuscating crash reports
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          retention-days: 365

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          flags=(--verify-tag --generate-notes --title "CountMe ${TAG}")
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); fi
          gh release create "$TAG" "${flags[@]}" \
            "dist/CountMe-${TAG}.apk" \
            "dist/CountMe-${TAG}.apk.sha256" \
            "dist/signing-certificate.sha256"

      - name: Remove signing material
        if: always()
        run: rm -f "$RUNNER_TEMP/release.jks" keystore.properties
